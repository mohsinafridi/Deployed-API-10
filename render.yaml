databases:
  - name: api-db
    plan: free
    databaseName: apidb
    user: apidb_user

services:
  - type: web
    name: deployed-api
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
